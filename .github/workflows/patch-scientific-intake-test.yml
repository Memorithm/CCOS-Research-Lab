name: Patch scientific intake test

on:
  push:
    branches: ["feat/papers-scientific-intake-v1"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/papers-scientific-intake-v1
          fetch-depth: 0
      - name: Replace fragile escaped-JSON assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/scientific_intake.rs")
          text = path.read_text()
          old = '''        let serialized = serde_json::to_string(&log).unwrap();
        assert!(serialized.contains("papers_experiment_proposal_v1"));
        assert!(serialized.contains("\\\\\\\"timeout_seconds\\\\\\\":30"));
        assert!(!serialized.contains("untrusted hypothesis"));
        assert!(!serialized.contains("try method X"));
'''
          new = '''        let EventPayload::Custom { key, value } = &log.events[0].payload else {
            panic!("proposal audit must use EventPayload::Custom");
        };
        assert_eq!(key, "papers_experiment_proposal_v1");
        let audit: serde_json::Value = serde_json::from_str(value).unwrap();
        assert_eq!(audit["resource_limits"]["timeout_seconds"].as_u64(), Some(30));
        let serialized = serde_json::to_string(&log).unwrap();
        assert!(!serialized.contains("untrusted hypothesis"));
        assert!(!serialized.contains("try method X"));
'''
          if old not in text:
              raise SystemExit("expected test block not found; refusing to patch")
          path.write_text(text.replace(old, new, 1))
      - name: Commit exact test repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scientific_intake.rs
          git diff --cached --check
          git commit -m "test(science): inspect structured proposal audit"
          git push origin HEAD:feat/papers-scientific-intake-v1
