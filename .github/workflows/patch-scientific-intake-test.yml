name: Patch scientific intake test

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/papers-scientific-intake-v1
          fetch-depth: 0
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Patch test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/scientific_intake.rs")
          text = path.read_text()
          start_marker = "    #[test]\n    fn standalone_proposal_is_attested_but_not_executed() {\n"
          end_marker = "\n    #[test]\n    fn zero_resource_limit_is_rejected_before_audit() {\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit("test boundaries not found; refusing to patch")
          replacement = '''    #[test]
              fn standalone_proposal_is_attested_but_not_executed() {
                  let mut log = EventLog::new("science-test".into());
                  let receipt = import_experiment_proposal(&proposal(), &mut log).unwrap();
                  assert_eq!(receipt.id, "exp-1");
                  assert_eq!(log.event_count(), 1);
                  let EventPayload::Custom { key, value } = &log.events[0].payload else {
                      panic!("proposal audit must use EventPayload::Custom");
                  };
                  assert_eq!(key, "papers_experiment_proposal_v1");
                  let audit: serde_json::Value = serde_json::from_str(value).unwrap();
                  assert_eq!(audit["resource_limits"]["timeout_seconds"].as_u64(), Some(30));
                  let serialized = serde_json::to_string(&log).unwrap();
                  assert!(!serialized.contains("untrusted hypothesis"));
                  assert!(!serialized.contains("try method X"));
              }
          '''
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines()) + "\n"
          path.write_text(text[:start] + replacement + text[end:])
          PY
          cargo +1.89.0 fmt --package ccos-research-lab
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scientific_intake.rs
          git commit -m "test(science): inspect structured proposal audit"
          git push origin HEAD:feat/papers-scientific-intake-v1
