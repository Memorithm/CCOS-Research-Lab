name: security-audit-temporary

on:
  push:
    branches:
      - arch/canonical-octasoma-v05
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Open Dependabot alert metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh api --paginate "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
            --jq '.[] | {number, dependency: .dependency.package.name, ecosystem: .dependency.package.ecosystem, manifest: .dependency.manifest_path, severity: .security_advisory.severity, ghsa_id: .security_advisory.ghsa_id, vulnerable: .security_vulnerability.vulnerable_version_range, first_patched: (.security_vulnerability.first_patched_version.identifier // null)}'
          rc=$?
          echo "dependabot_api_exit=$rc"
          exit 0
      - name: Trace unmaintained dependency usage
        shell: bash
        run: |
          set -euo pipefail
          echo "===== direct bincode usage ====="
          grep -R 'bincode::' -n crates/forge/forge-core/src || true
          echo "===== direct sled usage ====="
          grep -R 'sled::' -n crates/forge/forge-core/src || true
          echo "===== direct wasmi usage ====="
          grep -R 'wasmi::' -n crates/ccos-rsi/src || true
