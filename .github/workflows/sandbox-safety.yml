# ┌──────────────────────────────────────────────────────────────────────┐
# │  EXPERIMENTAL — OUTSIDE CERTIFIABLE PRODUCT BOUNDARY                 │
# │  CCOS Research Lab — sandbox & candidate-execution safety gate.      │
# │  HARD RULE: never run this on a runner containing API keys, GitHub   │
# │  write tokens, SSH keys, Docker socket access, production repos, or  │
# │  Enterprise secrets (docs/EXPERIMENT_SAFETY.md).                     │
# └──────────────────────────────────────────────────────────────────────┘
name: sandbox-safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    name: sandbox + generated-code execution safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: no-secret posture (job env must be empty of tokens)
        run: |
          ! env | grep -iE 'token|secret|api[_-]?key|password'
          echo "no secrets present in job environment"

      # Dependency acquisition is infrastructure bootstrap, not candidate
      # evaluation. Populate Cargo's registry/git caches explicitly while the
      # read-only job still has network, then make every sandbox/evaluator step
      # below prove that it succeeds with Cargo offline.
      - name: bootstrap locked dependencies (network allowed only here)
        run: cargo fetch --locked

      - name: sandbox unit tests (fail-closed semantics)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --release -p ccos-sandbox --locked -- --nocapture

      - name: sandbox-elite injection tests (forge)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --release -p forge-core sandbox --locked -- --nocapture

      - name: no-network during evaluation
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          # The guarded evaluator must pin cargo offline; verify the pin exists.
          grep -R 'CARGO_NET_OFFLINE\|--offline --frozen' -n src/rsi_bridge.rs crates/ccos-rsi/src | head -5
          cargo test --release -p ccos-research-lab --features rsi --locked rsi_bridge -- --nocapture

      # ── Expansion contract (charter §42): the following classes MUST be
      # added as the sandbox grows, each as a named job step:
      #   timeout tests · descendant-process termination · memory-limit ·
      #   CPU-limit · process-limit · output-limit · symlink tests ·
      #   path-traversal tests · evaluator-modification detection ·
      #   test-modification detection · Docker-access denial ·
      #   SSH-access denial · exfiltration tests · atomic-promotion tests.
      # A step is added only with a failing-first test proving the control.
