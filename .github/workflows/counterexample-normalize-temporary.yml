name: temporary-counterexample-normalize

on:
  push:
    branches:
      - feat/counterexample-shrinking-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/counterexample-shrinking-v1
          fetch-depth: 1
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Apply targeted invariant corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ccos-rsi/src/counterexample.rs')
          s = p.read_text()
          s = s.replace(
              '''        if receipt.original_input_bytes == 0\n            || receipt.minimized_input_bytes == 0\n            || receipt.minimized_input_bytes > receipt.original_input_bytes\n        {''',
              '''        if receipt.minimized_input_bytes > receipt.original_input_bytes {'''
          )
          s = s.replace(
              '''        if self.original_input.is_empty() || self.minimized_input.is_empty() {\n            return Err(CandidateProtocolError::PolicyViolation(\n                "counterexample witness inputs must be non-empty".into(),\n            ));\n        }\n''',
              ''
          )
          s = s.replace(
              '''    fn validate_generated_case(&self, input: &[u8]) -> Result<(), CandidateProtocolError> {\n        if input.is_empty() {\n            return Err(CandidateProtocolError::PolicyViolation(\n                "counterexample generator produced an empty case".into(),\n            ));\n        }\n        if input.len() > self.config.max_case_bytes {''',
              '''    fn validate_generated_case(&self, input: &[u8]) -> Result<(), CandidateProtocolError> {\n        if input.len() > self.config.max_case_bytes {'''
          )
          s = s.replace(
              '''                    !candidate.is_empty()\n                        && candidate.len() <= self.config.max_case_bytes\n                        && case_order(candidate, &current) == Ordering::Less''',
              '''                    candidate.len() <= self.config.max_case_bytes\n                        && case_order(candidate, &current) == Ordering::Less'''
          )
          s = s.replace(
              '''        Ok(Self {\n            generator,\n            shrinker,\n            oracle,\n            config,\n        })''',
              '''        CounterexampleConfig::new(\n            config.generation_budget,\n            config.shrink_query_budget,\n            config.max_case_bytes,\n        )?;\n        Ok(Self {\n            generator,\n            shrinker,\n            oracle,\n            config,\n        })'''
          )
          p.write_text(s)
          PY
          cargo +1.89.0 fmt --package rsi
      - name: Commit targeted correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ccos-rsi/src/counterexample.rs
          git commit --no-verify -m "fix(counterexample): allow empty witnesses and revalidate config"
          git push origin HEAD:feat/counterexample-shrinking-v1
