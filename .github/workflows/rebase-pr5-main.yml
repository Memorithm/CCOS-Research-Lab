name: Rebase PR5 on current main

on:
  push:
    branches: ["fix/issue-3-dependabot-security"]

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/issue-3-dependabot-security
          fetch-depth: 0
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Merge current main and preserve PR5 security changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            # CI in main contains the newer RSI/candidate matrix from merged PR #2.
            if git ls-files -u -- .github/workflows/ci.yml | grep -q .; then
              git checkout --theirs -- .github/workflows/ci.yml
              git add .github/workflows/ci.yml
            fi
            # Keep every new RSI feature/dependency from PR #2, then re-apply
            # only PR #5's audited local scirust-rsi source below.
            if git ls-files -u -- crates/ccos-rsi/Cargo.toml | grep -q .; then
              git checkout --theirs -- crates/ccos-rsi/Cargo.toml
              git add crates/ccos-rsi/Cargo.toml
            fi
          fi

          cat > /tmp/reapply_pr5.py <<'PY'
          from pathlib import Path
          path = Path('crates/ccos-rsi/Cargo.toml')
          text = path.read_text()
          text = text.replace(
              '# Moteur d’ascension réel `scirust-rsi` (dépendance git Memorithm/scirust).',
              '# Moteur d’ascension réel `scirust-rsi` (snapshot local épinglé et auditable).'
          )
          text = text.replace(
              '# Moteur d\'ascension réel `scirust-rsi` (dépendance git Memorithm/scirust).',
              '# Moteur d\'ascension réel `scirust-rsi` (snapshot local épinglé et auditable).'
          )
          old = 'scirust-rsi = { git = "https://github.com/Memorithm/scirust", rev = "5c7e43b399d3247d68a957faf5e13f147e48a7ef", optional = true }\n'
          new = '# Vendored from Memorithm/scirust at 5c7e43b399d3247d68a957faf5e13f147e48a7ef.\n# Keeping this as a local path is required by the offline sandbox-safety gate.\nscirust-rsi = { path = "../../vendor/scirust-rsi", optional = true }\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'scirust-rsi = { path = "../../vendor/scirust-rsi"' not in text:
              raise SystemExit('current-main scirust-rsi anchor changed; refusing blind edit')
          path.write_text(text)
          PY
          python3 /tmp/reapply_pr5.py
          git add crates/ccos-rsi/Cargo.toml

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unexpected unresolved conflicts:" >&2
            echo "$unresolved" >&2
            exit 1
          fi

      - name: Validate merged security surfaces
        run: |
          set -euo pipefail
          cargo +1.89.0 fmt --package ccos-research-lab --check
          cargo +1.89.0 fmt --package rsi --check
          cargo +1.89.0 fmt --manifest-path crates/forge/forge-core/Cargo.toml -- --check
          cargo +1.89.0 check -p rsi --features scirust,wasm --locked
          cargo +1.89.0 check -p forge-core --locked
          cargo +1.89.0 check -p slha-python --locked
          cargo +1.89.0 tree -p rsi --features scirust --locked | tee /tmp/rsi-tree.txt
          if grep -F 'https://github.com/Memorithm/scirust' /tmp/rsi-tree.txt; then
            echo 'RSI graph still contains the forbidden scirust Git source' >&2
            exit 1
          fi
          git diff --check

      - name: Commit merge and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/rebase-pr5-main.yml
          git add -A
          git diff --cached --check
          git commit -m "merge: refresh security hardening on RSI main"
          git push origin HEAD:fix/issue-3-dependabot-security
