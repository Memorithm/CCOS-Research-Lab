name: Refresh canonical OctaSoma pin

on:
  push:
    branches: [arch/canonical-octasoma-v05]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: arch/canonical-octasoma-v05
          fetch-depth: 0
      - name: Install MSRV
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Advance canonical OctaSoma revision
        shell: bash
        run: |
          set -euo pipefail
          old='513cad43cb430b0e898330d67ea34ccfcd305b88'
          new='145761aeb52ef8ded85dcf2b8c97690005284926'
          python3 - <<'PY'
          from pathlib import Path
          old = "513cad43cb430b0e898330d67ea34ccfcd305b88"
          new = "145761aeb52ef8ded85dcf2b8c97690005284926"
          for name in ["Cargo.toml", "crates/ccos-octacore/Cargo.toml"]:
              p = Path(name)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"missing expected OctaSoma pin in {name}")
              p.write_text(s.replace(old, new))
          PY
          cargo +1.89.0 update -p octasoma
          cargo +1.89.0 check --features octasoma --locked
          cargo +1.89.0 check --features octacore --locked
      - name: Commit regenerated lock and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-octasoma-pin.yml
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add Cargo.toml Cargo.lock crates/ccos-octacore/Cargo.toml .github/workflows/refresh-octasoma-pin.yml
          git commit -m 'chore(memory): pin final OctaSoma v0.5 revision'
          git push origin HEAD:arch/canonical-octasoma-v05
