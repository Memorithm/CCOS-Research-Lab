name: Normalize scientific intake branch

on:
  push:
    branches:
      - feat/papers-scientific-intake-v1

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/papers-scientific-intake-v1
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - run: cargo +1.89.0 fmt --package ccos-research-lab
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'chore: format scientific intake'
          git push origin HEAD:feat/papers-scientific-intake-v1
