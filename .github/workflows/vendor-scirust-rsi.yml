# Temporary branch-only workflow. It materializes the pinned upstream scirust-rsi
# source into this repository, then is removed before the PR is ready to merge.
name: Vendor scirust-rsi

on:
  push:
    branches:
      - fix/issue-3-dependabot-security

permissions:
  contents: write

jobs:
  vendor:
    if: ${{ !contains(github.event.head_commit.message, 'vendor(scirust-rsi):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize pinned upstream crate
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REV='5c7e43b399d3247d68a957faf5e13f147e48a7ef'
          rm -rf /tmp/scirust vendor/scirust-rsi
          git clone --filter=blob:none --no-checkout https://github.com/Memorithm/scirust.git /tmp/scirust
          git -C /tmp/scirust sparse-checkout init --cone
          git -C /tmp/scirust sparse-checkout set scirust-rsi LICENSE.md
          git -C /tmp/scirust checkout "$UPSTREAM_REV"
          mkdir -p vendor/scirust-rsi
          cp -a /tmp/scirust/scirust-rsi/. vendor/scirust-rsi/
          cp /tmp/scirust/LICENSE.md vendor/scirust-rsi/LICENSE.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vendor/scirust-rsi/Cargo.toml')
          s = p.read_text()
          s = s.replace('license-file = "../LICENSE.md"', 'license-file = "LICENSE.md"')
          # The vendored package is consumed as a dependency; upstream dev-only
          # path dependencies point outside this snapshot and are intentionally
          # removed. Runtime/features remain byte-for-byte upstream otherwise.
          marker = '[dev-dependencies]'
          if marker in s:
              s = s.split(marker, 1)[0].rstrip() + '\n\n[workspace]\n'
          elif '[workspace]' not in s:
              s = s.rstrip() + '\n\n[workspace]\n'
          p.write_text(s)
          PY
          cat > vendor/scirust-rsi/UPSTREAM.md <<EOF
          # Vendored provenance

          - Upstream repository: https://github.com/Memorithm/scirust
          - Upstream crate: \`scirust-rsi\`
          - Pinned commit: \`$UPSTREAM_REV\`
          - Snapshot policy: complete upstream \`scirust-rsi/\` directory at the pinned commit.
          - Local-only manifest edits: \`license-file\` points at the copied \`LICENSE.md\`; upstream dev-only path dependencies are removed; an empty \`[workspace]\` keeps this vendor package outside the parent workspace.
          - Runtime source files are otherwise copied from the pinned upstream commit.

          The copied \`LICENSE.md\` and its Required Notice are retained verbatim.
          EOF
          test -f vendor/scirust-rsi/src/lib.rs
          test -f vendor/scirust-rsi/src/refine.rs
          test -f vendor/scirust-rsi/LICENSE.md
          grep -F 'Required Notice:' vendor/scirust-rsi/LICENSE.md
      - name: Commit vendored snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/scirust-rsi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'vendor(scirust-rsi): pin offline source snapshot'
          git push
