name: refresh-lock-temporary

on:
  push:
    branches:
      - arch/canonical-octasoma-v05

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: arch/canonical-octasoma-v05
          fetch-depth: 0
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Refresh Cargo.lock resolution only
        run: cargo +1.89.0 metadata --format-version 1 > /dev/null
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh lockfile for canonical OctaSoma"
          git push origin HEAD:arch/canonical-octasoma-v05
