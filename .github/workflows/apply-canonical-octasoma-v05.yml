name: Apply canonical OctaSoma v0.5

on:
  push:
    branches:
      - arch/canonical-octasoma-v05

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/canonical-octasoma-v05
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Replace active vendored OctaSoma edges with canonical pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          SHA = "513cad43cb430b0e898330d67ea34ccfcd305b88"

          root = Path("Cargo.toml")
          text = root.read_text()
          old = 'octasoma = { path = "crates/ccos-octasoma", optional = true }'
          new = f'octasoma = {{ git = "https://github.com/Memorithm/octasoma", rev = "{SHA}", default-features = false, optional = true }}'
          if text.count(old) != 1:
              raise SystemExit(f"root octasoma dependency anchor count={text.count(old)}")
          text = text.replace(old, new)
          old_member = '    "crates/ccos-octasoma",\n'
          if text.count(old_member) != 1:
              raise SystemExit(f"workspace member anchor count={text.count(old_member)}")
          text = text.replace(old_member, '')
          old_exclude = 'exclude = ["fuzz"]'
          new_exclude = 'exclude = ["fuzz", "crates/ccos-octasoma"]'
          if text.count(old_exclude) != 1:
              raise SystemExit(f"workspace exclude anchor count={text.count(old_exclude)}")
          text = text.replace(old_exclude, new_exclude)
          root.write_text(text)

          core = Path("crates/ccos-octacore/Cargo.toml")
          text = core.read_text()
          old = 'octasoma = { path = "../ccos-octasoma" }'
          new = f'octasoma = {{ git = "https://github.com/Memorithm/octasoma", rev = "{SHA}", default-features = false }}'
          if text.count(old) != 1:
              raise SystemExit(f"octacore dependency anchor count={text.count(old)}")
          core.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          cargo generate-lockfile
      - name: Validate direct and OctaCore Research paths
        shell: bash
        run: |
          set -euo pipefail
          cargo check --features octasoma --locked
          cargo test --features octasoma --lib --locked
          cargo check --features octacore --locked
          cargo test -p octacore --locked
      - name: Commit migration and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ZEKRITI Tarek"
          git config user.email "contact@checkupauto.fr"
          git add Cargo.toml Cargo.lock crates/ccos-octacore/Cargo.toml
          git rm .github/workflows/apply-canonical-octasoma-v05.yml
          git commit -m "arch(memory): use canonical OctaSoma v0.5"
          git push origin HEAD:arch/canonical-octasoma-v05
