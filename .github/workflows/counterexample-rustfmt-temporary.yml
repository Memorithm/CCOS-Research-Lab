name: temporary-counterexample-rustfmt

on:
  push:
    branches:
      - feat/counterexample-shrinking-v1

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/counterexample-shrinking-v1
          fetch-depth: 1
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Apply exact parent CI rustfmt surface
        run: |
          cargo +1.89.0 fmt --package ccos-research-lab
          cargo +1.89.0 fmt --package rsi
          cargo +1.89.0 fmt --package ccos-sandbox
          cargo +1.89.0 fmt --manifest-path crates/forge/forge-core/Cargo.toml --
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit --no-verify -m "style(counterexample): apply rustfmt"
          git push origin HEAD:feat/counterexample-shrinking-v1
