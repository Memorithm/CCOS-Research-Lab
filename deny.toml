[graph]
all-features = true
targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "PolyForm-Noncommercial-1.0.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Custom source-available licenses are not globally allowed. Keep each reviewed
# exception tied to the exact in-ecosystem package that declares it, so another
# dependency cannot silently acquire the same permission.
exceptions = [
    { crate = "ccos-sandbox", allow = ["LicenseRef-TarekZekriti-Dual"] },
    { crate = "octasoma", allow = ["LicenseRef-CheckupAuto-Dual"] },
]

[licenses.private]
# Workspace crates carry the repository's source-available/custom commercial
# terms. Unpublished private workspace members are ignored here; publishable or
# external custom-license crates still require the explicit exceptions above.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/Memorithm/scirust",
    "https://github.com/Memorithm/octasoma",
]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
